<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student View | AttendEase</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header class="topbar"><a class="brand" href="index.html">AttendEase</a><nav><a href="index.html">Home</a><a href="admin.html">Admin Panel</a></nav></header>
